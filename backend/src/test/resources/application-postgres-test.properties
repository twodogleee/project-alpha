# 显式 PostgreSQL 验证任务：连接真实数据库，schema 由测试动态隔离。
spring.datasource.dynamic.datasource.master.username=${ALPHA_DATABASE_USERNAME:postgres}
spring.datasource.dynamic.datasource.master.password=${ALPHA_DATABASE_PASSWORD:}
spring.datasource.dynamic.datasource.master.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.sql.init.mode=never
