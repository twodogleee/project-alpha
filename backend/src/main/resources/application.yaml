server:
  address: ${ALPHA_SERVER_ADDRESS:127.0.0.1}
  port: ${ALPHA_SERVER_PORT:18080}

spring:
  config:
    # 仅后端读取的本地配置，不打包、不进入版本控制；环境变量优先。
    import: optional:file:./.env[.properties]
  application:
    name: project-alpha
  mvc:
    log-request-details: false
  datasource:
    dynamic:
      primary: master
      strict: true
      hikari:
        is-auto-commit: true
        connection-test-query: select 1
        connection-timeout: 3000
        idle-timeout: 30000
        max-lifetime: 1800000
        max-pool-size: 15
        minimum-idle: 2
      datasource:
        master:
          url: ${ALPHA_DATABASE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=${ALPHA_DATABASE_SCHEMA:project_alpha_dev}}
          username: ${ALPHA_DATABASE_USERNAME:postgres}
          password: ${ALPHA_DATABASE_PASSWORD:}
          driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${ALPHA_DATABASE_SCHEMA:project_alpha_dev}
    default-schema: ${ALPHA_DATABASE_SCHEMA:project_alpha_dev}
    create-schemas: true
    clean-disabled: true
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-numbers-for-enums: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true
    # 不输出可能含需求正文的 SQL 参数。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false

alpha:
  prototype:
    artifact-root: ${ALPHA_PROTOTYPE_ARTIFACT_ROOT:./data/prototypes}
    generation:
      # 仅启用入口；真实模型配置与本机 Worker 工具链均可用时才接收任务。
      enabled: ${ALPHA_PROTOTYPE_GENERATION_ENABLED:true}
      chromium-executable: ${PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH:}
      node-executable: ${ALPHA_PROTOTYPE_NODE:node}
      worker-directory: ${ALPHA_PROTOTYPE_WORKER_DIR:./prototype-worker}
      template-directory: ${ALPHA_PROTOTYPE_TEMPLATE_DIR:./prototype-template/zero-admin}
  model-config:
    # 加密主密钥只在后端读取；未指定时首次保存密钥生成本地私有文件。
    encryption-key: ${ALPHA_MODEL_CONFIG_ENCRYPTION_KEY:}
    key-file: ${ALPHA_MODEL_CONFIG_KEY_FILE:./data/model-config.key}

# SDK 解析失败会记录模型原文；由业务测试入口提供不含正文的安全诊断。
logging:
  # 参考 Zero 的控制台和按日期/大小滚动文件；沿用 Boot 已有 SLF4J/Logback。
  file:
    name: ${ALPHA_LOG_DIR:./logs}/app.log
  logback:
    rollingpolicy:
      file-name-pattern: ${ALPHA_LOG_DIR:./logs}/app-%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 100MB
      max-history: 3
      total-size-cap: 1GB
      clean-history-on-start: true
  level:
    root: INFO
    org.springframework.ai.converter.BeanOutputConverter: "OFF"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
